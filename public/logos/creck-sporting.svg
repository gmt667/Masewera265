  <polygon points="100,26 164,62 164,128 100,176 36,128 36,62" fill="#0d400d" stroke="#00cc44" stroke-width="2"/>
  <!-- Stylised C letter -->
  <path d="M 130 76 A 32 32 0 1 0 130 118" fill="none" stroke="#00cc44" stroke-width="10" stroke-linecap="round"/>
