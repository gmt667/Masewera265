<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="boxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#991b1b" stroke="url(#boxGold)" stroke-width="7"/>
  <circle cx="100" cy="100" r="82" fill="#7f1d1d" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Boxing Gloves & Ropes -->
  <g transform="translate(100, 88)">
    <!-- Boxing ring ropes in background -->
    <line x1="-50" y1="-25" x2="50" y2="-25" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="5" x2="50" y2="5" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    
    <!-- Red/Gold Boxing Gloves Clashing -->
    <!-- Left Glove -->
    <path d="M-6 -18 C-25 -28 -35 -10 -30 10 C-25 22 -10 20 -4 10 L-6 -18 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <rect x="-18" y="10" width="12" height="10" rx="2" fill="#ffffff"/>
    <!-- Right Glove -->
    <path d="M6 -18 C25 -28 35 -10 30 10 C25 22 10 20 4 10 L6 -18 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <rect x="6" y="10" width="12" height="10" rx="2" fill="#ffffff"/>
    
    <!-- Clash Star -->
    <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" fill="#ffffff"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="38" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3">MABA</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ffd700" letter-spacing="1">MALAWI BOXING</text>
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.8">ASSOCIATION</text>
</svg>
