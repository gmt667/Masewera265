<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Blue and white shield (Dedza town colours) -->
  <polygon points="100,10 180,50 180,135 100,192 20,135 20,50" fill="#1e3a6e" stroke="#ffffff" stroke-width="5"/>
  <!-- Left half: blue, right half: white -->
  <polygon points="100,26 164,62 164,128 100,176" fill="#f0f0f0" stroke="none"/>
  <polygon points="100,26 36,62 36,128 100,176" fill="#1e3a6e" stroke="none"/>
  <!-- Inner border -->
  <polygon points="100,26 164,62 164,128 100,176 36,128 36,62" fill="none" stroke="#e0a020" stroke-width="3"/>
  <!-- Volcano/Dzalanyama mountain silhouette (Dedza highlands) -->
  <polygon points="70,115 100,72 130,115" fill="#e0a020" opacity="0.9"/>
  <polygon points="78,115 100,80 122,115" fill="#c47a10"/>
  <!-- Dynamo lightning bolt -->
  <polygon points="107,78 98,97 106,97 93,120 102,100 94,100" fill="#ffd700"/>
  <!-- Club text -->
  <text x="100" y="152" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#ffd700" letter-spacing="1">DEDZA</text>
  <text x="100" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1">DYNAMOS</text>
</svg>
