<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shield base: army green -->
  <polygon points="100,10 180,50 180,130 100,190 20,130 20,50" fill="#4a7c59" stroke="#d4af37" stroke-width="5"/>
  <!-- Inner shield -->
  <polygon points="100,28 164,62 164,124 100,172 36,124 36,62" fill="#2d5a3d" stroke="#d4af37" stroke-width="2"/>
  <!-- Crossed rifles symbol -->
  <line x1="60" y1="80" x2="140" y2="120" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="80" x2="60" y2="120" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <!-- Star above -->
  <polygon points="100,40 104,53 118,53 107,62 111,75 100,66 89,75 93,62 82,53 96,53" fill="#d4af37"/>
  <!-- Text -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#d4af37" letter-spacing="1">MOYALE</text>
  <text x="100" y="168" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1">BARRACKS</text>
</svg>
