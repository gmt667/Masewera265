<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Chitipa United – blue/white, northern Malawi -->
  <polygon points="100,10 180,50 180,135 100,192 20,135 20,50" fill="#003580" stroke="#ffffff" stroke-width="5"/>
  <polygon points="100,26 164,62 164,128 100,176 36,128 36,62" fill="#002566" stroke="#ffffff" stroke-width="2"/>
  <!-- Mountain silhouette (Misuku Hills, Chitipa) -->
  <polygon points="36,125 60,82 78,105 100,60 122,105 140,82 164,125" fill="#5599dd" opacity="0.5"/>
  <polygon points="36,125 60,82 78,105 100,64 122,105 140,82 164,125" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Snow caps -->
  <polygon points="100,64 91,80 109,80" fill="#ffffff" opacity="0.9"/>
  <!-- CHITIPA text -->
  <text x="100" y="152" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">CHITIPA</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffd700" letter-spacing="1">UNITED FC</text>
</svg>
