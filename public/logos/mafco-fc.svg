<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark red shield -->
  <polygon points="100,10 180,50 180,135 100,192 20,135 20,50" fill="#8b0000" stroke="#ffd700" stroke-width="5"/>
  <polygon points="100,26 164,62 164,128 100,176 36,128 36,62" fill="#6b0000" stroke="#ffd700" stroke-width="2"/>
  <!-- Malawi Army cog/gear for MAFCO (Malawi Armed Forces) -->
  <circle cx="100" cy="97" r="28" fill="none" stroke="#ffd700" stroke-width="6"/>
  <circle cx="100" cy="97" r="14" fill="#ffd700"/>
  <circle cx="100" cy="97" r="7" fill="#8b0000"/>
  <!-- Gear teeth -->
  <rect x="96" y="58" width="8" height="14" rx="2" fill="#ffd700"/>
  <rect x="96" y="122" width="8" height="14" rx="2" fill="#ffd700"/>
  <rect x="61" y="93" width="14" height="8" rx="2" fill="#ffd700"/>
  <rect x="125" y="93" width="14" height="8" rx="2" fill="#ffd700"/>
  <rect x="72" y="68" width="8" height="14" rx="2" fill="#ffd700" transform="rotate(45,76,75)"/>
  <rect x="118" y="68" width="8" height="14" rx="2" fill="#ffd700" transform="rotate(-45,122,75)"/>
  <rect x="72" y="112" width="8" height="14" rx="2" fill="#ffd700" transform="rotate(-45,76,119)"/>
  <rect x="118" y="112" width="8" height="14" rx="2" fill="#ffd700" transform="rotate(45,122,119)"/>
  <!-- MAFCO text -->
  <text x="100" y="154" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#ffd700" letter-spacing="2">MAFCO</text>
  <text x="100" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#ffffff" letter-spacing="1">FC</text>
</svg>
