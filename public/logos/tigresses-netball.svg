<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tigOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>
  </defs>
  <!-- Circular Shield -->
  <circle cx="100" cy="100" r="92" fill="#111827" stroke="url(#tigOrange)" stroke-width="7"/>
  <circle cx="100" cy="100" r="82" fill="url(#tigOrange)" opacity="0.15"/>
  
  <!-- Tiger Head / Stripes Badge -->
  <g transform="translate(100, 85)">
    <!-- Tiger Silhouette Mask -->
    <path d="M-36 -30 C-45 -10 -40 20 0 45 C40 20 45 -10 36 -30 C20 -38 10 -25 0 -22 C-10 -25 -20 -38 -36 -30 Z" fill="#ff6600"/>
    <!-- Stripes -->
    <path d="M-28 -12 L-14 -10 L-24 4 Z" fill="#111827"/>
    <path d="M28 -12 L14 -10 L24 4 Z" fill="#111827"/>
    <path d="M-18 10 L-8 10 L-14 22 Z" fill="#111827"/>
    <path d="M18 10 L8 10 L14 22 Z" fill="#111827"/>
    <polygon points="0,-16 -6,-6 6,-6" fill="#111827"/>
    <polygon points="0,20 -8,12 8,12" fill="#ffffff"/>
    <!-- Fierce Eyes -->
    <polygon points="-16,-6 -6,-2 -14,2" fill="#ffd700"/>
    <polygon points="16,-6 6,-2 14,2" fill="#ffd700"/>
  </g>
  
  <!-- Netball ball below -->
  <circle cx="100" cy="130" r="14" fill="#ffffff" stroke="#ff6600" stroke-width="2"/>
  <path d="M90 126 Q100 132 110 126 M90 134 Q100 128 110 134" stroke="#111827" stroke-width="1.5" fill="none"/>
  
  <!-- Text Banners -->
  <text x="100" y="38" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2">TIGRESSES</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#ff6600" letter-spacing="1.5">NETBALL CLUB</text>
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.8">BLANTYRE</text>
</svg>
