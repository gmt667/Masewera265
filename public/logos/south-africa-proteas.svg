    <path d="M0 35 C-25 35 -40 15 -45 -5 C-30 0 -15 15 0 25 C15 15 30 0 45 -5 C40 15 25 35 0 35 Z" fill="#ffb81c"/>
    <path d="M0 -38 C12 -20 18 0 0 22 C-18 0 -12 -20 0 -38 Z" fill="#e91e63"/>
    <path d="M-15 -32 C-2 -18 2 2 -12 20 C-26 5 -26 -16 -15 -32 Z" fill="#f06292"/>
    <path d="M15 -32 C26 -16 26 5 12 20 C-2 2 2 -18 15 -32 Z" fill="#f06292"/>
    <path d="M-28 -22 C-16 -10 -12 8 -22 18 C-36 6 -36 -10 -28 -22 Z" fill="#ba68c8"/>
    <path d="M28 -22 C36 -10 36 6 22 18 C12 8 16 -10 28 -22 Z" fill="#ba68c8"/>
