<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ckDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ckGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Knight Shield Shape -->
  <path d="M100 12 L178 38 C178 126 138 174 100 192 C62 174 22 126 22 38 Z" fill="url(#ckDark)" stroke="url(#ckGold)" stroke-width="6"/>
  
  <!-- Medieval Knight Helmet / Visor with Basketball Texture -->
  <g transform="translate(100, 82)">
    <!-- Helmet Dome -->
    <path d="M-30 0 C-30 -35 30 -35 30 0 C30 20 20 35 0 42 C-20 35 -30 20 -30 0 Z" fill="#9ca3af" stroke="#ffffff" stroke-width="2"/>
    <!-- Plume Feather Crest -->
    <path d="M0 -34 C-5 -52 15 -52 5 -34" fill="url(#ckGold)"/>
    <!-- Visor Slits -->
    <rect x="-20" y="-8" width="40" height="6" rx="2" fill="#111827"/>
    <line x1="-12" y1="-8" x2="-12" y2="-2" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-4" y1="-8" x2="-4" y2="-2" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="4" y1="-8" x2="4" y2="-2" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="12" y1="-8" x2="12" y2="-2" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Chin Guard Grid -->
    <path d="M-15 12 L15 12 M-12 20 L12 20 M-8 28 L8 28" stroke="#374151" stroke-width="2"/>
  </g>
  
  <!-- Small Basketball below Helmet -->
  <circle cx="100" cy="136" r="14" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="86" y1="136" x2="114" y2="136" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="100" y1="122" x2="100" y2="150" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Text Banners -->
  <text x="100" y="38" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="1">CENTRAL</text>
  <text x="100" y="166" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" letter-spacing="2">KNIGHTS</text>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.8">LILONGWE</text>
</svg>
