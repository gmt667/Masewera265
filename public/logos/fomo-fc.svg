  <polygon points="100,26 164,62 164,128 100,176 36,128 36,62" fill="#360063" stroke="#c0c0c0" stroke-width="2"/>
  <!-- FOMO letters bold -->
  <text x="100" y="108" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#c0c0c0" letter-spacing="2">FOMO</text>
  <!-- FC small -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" font-weight="700" fill="#9966cc" letter-spacing="4">FC</text>
  <!-- Top decoration: lightning bolts -->
