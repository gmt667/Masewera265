  <!-- Bottom text -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#c0c0c0" letter-spacing="1">FOMO FC</text>
  <text x="100" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9966cc" letter-spacing="1">MALAWI</text>
