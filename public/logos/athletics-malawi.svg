<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="athGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#0f172a" stroke="url(#athGold)" stroke-width="6"/>
  <!-- Laurel Wreath & Track Lanes -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Dynamic Runner Silhouette & Flame Torch -->
  <g transform="translate(100, 95)">
    <!-- Torch Flame -->
    <path d="M12 -35 C18 -25 22 -15 15 -5 C10 0 5 -5 6 -15 C8 -25 2 -30 12 -35 Z" fill="#ff4500"/>
    <path d="M10 -25 C14 -18 16 -12 12 -5 C8 -2 5 -6 6 -12 Z" fill="#ffd700"/>
    <rect x="7" y="-5" width="6" height="15" rx="1.5" fill="#f59e0b"/>
    <!-- Sprinter Figure -->
    <circle cx="-6" cy="-22" r="6" fill="#ffd700"/>
    <path d="M-10 -14 L-2 -6 L-10 8 L-18 20 M-2 -6 L10 4 L14 18 M-8 -10 L-22 -8 M-4 -10 L8 -12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="36" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1.5">ATHLETICS</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="13" font-weight="900" fill="#ffd700" letter-spacing="2">MALAWI</text>
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.8">NATIONAL FEDERATION</text>
</svg>
