<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fazGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </linearGradient>
    <linearGradient id="fazGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008000"/>
      <stop offset="100%" stop-color="#004d00"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M100 12 L180 44 C180 128 142 176 100 192 C58 176 20 128 20 44 Z" fill="url(#fazGreen)" stroke="url(#fazGold)" stroke-width="6"/>
  <!-- Inner Shield Trim -->
  <path d="M100 22 L170 50 C170 122 136 166 100 180 C64 166 30 122 30 50 Z" fill="#006400" stroke="#ffffff" stroke-width="2"/>
  <!-- Soaring Copper Eagle (Zambia Emblem) -->
  <g transform="translate(100, 52) scale(0.72)">
    <path d="M0 -30 C15 -25 35 -15 50 5 C35 5 25 12 15 10 C30 20 20 30 5 22 C-5 22 -20 30 -15 10 C-25 12 -35 5 -50 5 C-35 -15 -15 -25 0 -30 Z" fill="#e65100"/>
    <circle cx="0" cy="-28" r="6" fill="#bf360c"/>
  </g>
  <!-- Football in Center -->
  <circle cx="100" cy="100" r="28" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <polygon points="100 86 90 94 94 106 106 106 110 94" fill="#000000"/>
  <line x1="100" y1="86" x2="100" y2="72" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="94" x2="78" y2="88" stroke="#000000" stroke-width="2"/>
  <line x1="94" y1="106" x2="84" y2="116" stroke="#000000" stroke-width="2"/>
  <line x1="106" y1="106" x2="116" y2="116" stroke="#000000" stroke-width="2"/>
  <line x1="110" y1="94" x2="122" y2="88" stroke="#000000" stroke-width="2"/>
  <!-- Zambian Flag Tricolor Bars -->
  <g transform="translate(64, 140)">
    <rect x="0" y="0" width="24" height="12" fill="#d32f2f"/>
    <rect x="24" y="0" width="24" height="12" fill="#000000"/>
    <rect x="48" y="0" width="24" height="12" fill="#f57c00"/>
  </g>
  <!-- FAZ Text Banner -->
  <text x="100" y="172" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#ffd700" letter-spacing="2">FAZ</text>
  <text x="100" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="1.5">ZAMBIA</text>
</svg>
