<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Masewera265">
  <defs>
    <linearGradient id="p-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192b" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>
    <linearGradient id="p-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#00d084" />
    </linearGradient>
    <linearGradient id="p-sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef233c" />
    </linearGradient>
    <linearGradient id="p-red-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d61" />
      <stop offset="100%" stop-color="#c9182b" />
    </linearGradient>
    <linearGradient id="p-green-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#057a55" />
    </linearGradient>
    <filter id="p-crest-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background base rounded card for icon use -->
  <rect width="512" height="512" rx="112" fill="#0b111c" />
  <!-- Shield Contour -->
  <g transform="translate(56, 40) scale(9.09)">
    <path
      d="M22 2.5 C31.5 2.5 39.5 5.5 39.5 15 C39.5 28.5 22 41.5 22 41.5 C22 41.5 4.5 28.5 4.5 15 C4.5 5.5 12.5 2.5 22 2.5 Z"
      fill="url(#p-shield-bg)"
      stroke="url(#p-border-grad)"
      stroke-width="1.6"
      stroke-linejoin="round"
      filter="url(#p-crest-shadow)"
    />
    <!-- Inner Shield Accent -->
    <path
      d="M22 5 C29.5 5 36.5 7.5 36.5 15 C36.5 26.5 22 38 22 38 C22 38 7.5 26.5 7.5 15 C7.5 7.5 14.5 5 22 5 Z"
      fill="none"
      stroke="rgba(255,255,255,0.12)"
      stroke-width="0.8"
    />
    <!-- Malawi Rising Sun Rays -->
    <g stroke="url(#p-sun-grad)" stroke-width="1.3" stroke-linecap="round" opacity="0.95">
      <line x1="22" y1="7" x2="22" y2="10.5" />
      <line x1="26.2" y1="7.8" x2="24.8" y2="11" />
      <line x1="30" y1="10.2" x2="27.7" y2="12.6" />
      <line x1="32.2" y1="13.8" x2="29.2" y2="14.9" />
      <line x1="17.8" y1="7.8" x2="19.2" y2="11" />
      <line x1="14" y1="10.2" x2="16.3" y2="12.6" />
      <line x1="11.8" y1="13.8" x2="14.8" y2="14.9" />
    </g>
    <!-- Rising Sun Core -->
    <circle cx="22" cy="16" r="2.8" fill="url(#p-sun-grad)" />
    <!-- Dynamic Athletic M (Red Flames Swoosh) -->
    <path
      d="M11 30.5 L11 20.5 C11 17 15 16 17.5 19.5 L22 25.5 L26.5 19.5 C29 16 33 17 33 20.5 L33 30.5"
      fill="none"
      stroke="url(#p-red-swoosh)"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Inner Pitch Chevron (Green Swoosh) -->
    <path
      d="M16 30.5 L22 22 L28 30.5"
      fill="none"
      stroke="url(#p-green-swoosh)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Central Triumph Spark -->
    <circle cx="22" cy="22" r="1.3" fill="#f59e0b" />
    <!-- 265 Tag Badge -->
    <rect x="13.5" y="31.5" width="17" height="6.5" rx="3.25" fill="#080f1a" stroke="url(#p-border-grad)" stroke-width="0.8" />
    <text
      x="22"
      y="36.2"
      font-family="Arial, sans-serif"
      font-size="4.4"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="0.6"
    >
      265
    </text>
  </g>
</svg>
